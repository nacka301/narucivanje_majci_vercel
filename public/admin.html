<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-65ZGTZJWXW"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-65ZGTZJWXW');
        </script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        body {
            background: linear-gradient(180deg, #f5f6f8 0%, #f1f1f6 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .admin-shell {
            width: min(1200px, 100%);
            margin: 0 auto;
            padding: 4rem clamp(1.25rem, 4vw, 4rem);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .admin-card,
        .order-card {
            background: var(--panel);
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 24px;
            padding: clamp(1.5rem, 2vw, 2.5rem);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        }

        .admin-card h1 {
            margin-bottom: 0.5rem;
        }

        #loginDiv {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        #adminPass {
            flex: 1;
            min-width: 220px;
            padding: 0.95rem 1.1rem;
            border-radius: 14px;
            border: 1px solid var(--border);
            font-size: 1rem;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .cta {
            padding: 0.95rem 1.8rem;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .admin-dashboard {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1rem;
        }

        .toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }

        .toolbar select,
        .toolbar button {
            padding: 0.75rem 1rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font-weight: 600;
        }

        .toolbar button {
            background: var(--text);
            color: #fff;
        }

        .stat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .chip {
            flex: 1;
            min-width: 160px;
            padding: 1rem;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.035);
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        .chip span {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .chip small {
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--muted);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            background: var(--panel);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .orders-table thead {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .orders-table th {
            padding: 1rem 0.85rem;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.75rem;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .orders-table th:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .orders-table tbody tr {
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            transition: background 0.2s;
        }

        .orders-table tbody tr:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        .orders-table td {
            padding: 1rem 0.85rem;
            vertical-align: top;
        }

        .order-name {
            font-weight: 600;
            color: var(--text);
        }

        .order-contact {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .order-meta {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            white-space: nowrap;
        }

        .status--zaprimljeno { background: rgba(59, 130, 246, 0.12); color: #1d4ed8; }
        .status--priprema { background: rgba(250, 204, 21, 0.18); color: #854d0e; }
        .status--poslano { background: rgba(16, 185, 129, 0.15); color: #047857; }
        .status--isporuceno { background: rgba(15, 157, 88, 0.15); color: #0f9d58; }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .order-actions select {
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 0.45rem 0.6rem;
            font-size: 0.85rem;
            background: #fff;
        }

        .pill-btn {
            border-radius: 8px;
            padding: 0.45rem 0.85rem;
            border: 1px solid transparent;
            background: rgba(99, 102, 241, 0.1);
            color: #312e81;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .pill-btn.success {
            background: rgba(15, 157, 88, 0.15);
            color: #0f9d58;
        }

        .pill-btn.ghost {
            background: rgba(15, 23, 42, 0.05);
            color: var(--text);
        }

        .pill-btn.danger {
            background: rgba(185, 28, 28, 0.12);
            color: #991b1b;
        }

        .note-icon {
            font-size: 1.1rem;
            cursor: help;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            border-radius: 18px;
            border: 1px dashed var(--border);
            background: rgba(255, 255, 255, 0.7);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="admin-shell">
        <div class="admin-card" id="loginSection">
            <h1>Admin panel</h1>
            <p>Unesi admin lozinku i upravljaj svim narudžbama s jednog mjesta.</p>
            <div id="loginDiv">
                <input type="password" id="adminPass" placeholder="Unesi admin lozinku">
                <button class="cta" onclick="ucitajPodatke()">Prijava</button>
            </div>
        </div>

        <div class="admin-dashboard hidden" id="dashboard">
            <div class="admin-card">
                <div class="toolbar">
                    <div>
                        <h2>Pregled narudžbi</h2>
                        <p class="order-meta">Brzo filtriraj, označi kao poslano ili evidentiraj uplatu.</p>
                    </div>
                    <div class="toolbar-actions">
                        <select id="statusFilter">
                            <option value="sve">Sve narudžbe</option>
                            <option value="zaprimljeno">Zaprimljeno</option>
                            <option value="priprema">U pripremi</option>
                            <option value="poslano">Poslano</option>
                            <option value="isporuceno">Isporučeno</option>
                        </select>
                        <button id="refreshBtn">Osvježi</button>
                        <button id="logoutBtn" class="pill-btn ghost" style="margin-left:0.25rem">Odjavi se</button>
                    </div>
                </div>

                <div class="stat-chips">
                    <div class="chip"><span id="statTotal">0</span><small>Ukupno</small></div>
                    <div class="chip"><span id="statShipped">0</span><small>Poslano</small></div>
                    <div class="chip"><span id="statPaid">0</span><small>Plaćeno</small></div>
                </div>
            </div>

            <div class="table-wrapper" id="tableWrapper"></div>
            <div class="empty-state hidden" id="emptyState">Nema narudžbi za prikaz.</div>
        </div>
    </div>

    <script>
        const STATUS_LABELS = {
            zaprimljeno: 'Zaprimljeno',
            priprema: 'U pripremi',
            poslano: 'Poslano',
            isporuceno: 'Isporučeno'
        };

        let adminPassword = '';
        let narudzbe = [];
        let sortColumn = 'datum';
        let sortDirection = 'desc';

        const tableWrapper = document.getElementById('tableWrapper');
        const emptyState = document.getElementById('emptyState');
        const statusFilter = document.getElementById('statusFilter');
        const loginSection = document.getElementById('loginSection');
        const dashboard = document.getElementById('dashboard');

        dashboard?.classList.add('hidden');

        statusFilter?.addEventListener('change', () => renderNarudzbe());
        document.getElementById('refreshBtn')?.addEventListener('click', () => osvjeziNarudzbe(true));
        document.getElementById('logoutBtn')?.addEventListener('click', odjava);

        const escapeHtml = (value = '') => value
            .toString()
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        async function ucitajPodatke() {
            adminPassword = document.getElementById('adminPass').value.trim();
            if (!adminPassword) {
                alert('Unesi lozinku.');
                return;
            }
            await osvjeziNarudzbe();
        }

        async function osvjeziNarudzbe(showToast) {
            try {
                const res = await fetch('/api/admin/narudbe', {
                    headers: { 'x-admin-pass': adminPassword }
                });

                if (res.status === 403) {
                    alert('Kriva lozinka!');
                    return;
                }

                narudzbe = await res.json();
                loginSection?.classList.add('hidden');
                dashboard?.classList.remove('hidden');
                azurirajStatuse();
                renderNarudzbe();
                if (showToast) alert('Podaci osvježeni.');
            } catch (err) {
                console.error(err);
                alert('Neuspjelo dohvaćanje narudžbi.');
            }
        }

        function azurirajStatuse() {
            const ukupno = narudzbe.length;
            const poslano = narudzbe.filter(n => n.status === 'poslano' || n.status === 'isporuceno').length;
            const placeno = narudzbe.filter(n => n.placeno).length;
            document.getElementById('statTotal').textContent = ukupno;
            document.getElementById('statShipped').textContent = poslano;
            document.getElementById('statPaid').textContent = placeno;
        }

        function renderNarudzbe() {
            const filter = statusFilter.value;
            let prikaz = filter === 'sve' ? [...narudzbe] : narudzbe.filter(n => n.status === filter);

            // Sortiranje
            prikaz.sort((a, b) => {
                let valA, valB;
                switch (sortColumn) {
                    case 'datum':
                        valA = new Date(a.datum);
                        valB = new Date(b.datum);
                        break;
                    case 'ime':
                        valA = a.ime_prezime?.toLowerCase() || '';
                        valB = b.ime_prezime?.toLowerCase() || '';
                        break;
                    case 'grad':
                        valA = a.grad?.toLowerCase() || '';
                        valB = b.grad?.toLowerCase() || '';
                        break;
                    case 'status':
                        valA = a.status || 'zaprimljeno';
                        valB = b.status || 'zaprimljeno';
                        break;
                    case 'placeno':
                        valA = a.placeno ? 1 : 0;
                        valB = b.placeno ? 1 : 0;
                        break;
                    default:
                        return 0;
                }
                if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            if (!prikaz.length) {
                tableWrapper.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tableWrapper.innerHTML = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable('datum')">Datum ${sortColumn === 'datum' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                            <th onclick="sortTable('ime')">Kupac ${sortColumn === 'ime' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                            <th onclick="sortTable('grad')">Lokacija ${sortColumn === 'grad' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                            <th>Proizvod</th>
                            <th onclick="sortTable('status')">Status ${sortColumn === 'status' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                            <th onclick="sortTable('placeno')">Plaćanje ${sortColumn === 'placeno' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                            <th>Akcije</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${prikaz.map(n => generirajRedak(n)).join('')}
                    </tbody>
                </table>
            `;
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            renderNarudzbe();
        }

        function generirajRedak(n) {
            const statusKlasa = `status--${n.status || 'zaprimljeno'}`;
            const datum = new Date(n.datum).toLocaleString('hr-HR', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            const modelInfo = `${escapeHtml(n.model || 'Majica')}`;
            const velicina = escapeHtml(n.velicina || '-');
            const kolicina = n.kolicina || 1;
            const napomenaIcon = n.napomena ? `<span class="note-icon" title="${escapeHtml(n.napomena)}">📝</span>` : '';

            return `
                <tr data-id="${n._id}">
                    <td><span class="order-meta">${datum}</span></td>
                    <td>
                        <div class="order-name">${escapeHtml(n.ime_prezime)}</div>
                        <div class="order-contact">${escapeHtml(n.telefon)}${n.email ? ' · ' + escapeHtml(n.email) : ''}</div>
                    </td>
                    <td>
                        <div>${escapeHtml(n.adresa || '—')}</div>
                        <div class="order-meta">${escapeHtml(n.grad || '—')}</div>
                    </td>
                    <td>
                        <div><strong>${modelInfo}</strong></div>
                        <div class="order-meta">${velicina} · ${kolicina}x</div>
                    </td>
                    <td><span class="badge ${statusKlasa}">${STATUS_LABELS[n.status] || 'Zaprimljeno'}</span></td>
                    <td>
                        <button class="pill-btn ${n.placeno ? 'success' : 'ghost'}" onclick="togglePlacanje('${n._id}', ${!n.placeno})">
                            ${n.placeno ? '✓ Plaćeno' : 'Čeka'}
                        </button>
                    </td>
                    <td>
                        <div class="order-actions">
                            <select onchange="promijeniStatus('${n._id}', this.value)">
                                ${Object.entries(STATUS_LABELS).map(([value, label]) => `
                                    <option value="${value}" ${n.status === value ? 'selected' : ''}>${label}</option>
                                `).join('')}
                            </select>
                            <button class="pill-btn ghost" onclick="urediNapomenu('${n._id}')" title="${n.napomena ? escapeHtml(n.napomena) : 'Dodaj bilješku'}">
                                ${napomenaIcon || '📝'}
                            </button>
                            <button class="pill-btn danger" onclick="obrisiNarudzbu('${n._id}')">✕</button>
                        </div>
                    </td>
                </tr>`;
        }

        async function promijeniStatus(id, status) {
            await posaljiPatch(id, { status });
        }

        async function togglePlacanje(id, placeno) {
            await posaljiPatch(id, { placeno });
        }

        function urediNapomenu(id) {
            const nar = narudzbe.find(n => n._id === id);
            const trenutna = nar?.napomena || '';
            const nova = prompt('Napomena', trenutna);
            if (nova === null) return;
            spremiNapomenu(id, nova);
        }

        async function spremiNapomenu(id, napomena) {
            await posaljiPatch(id, { napomena });
        }

        async function obrisiNarudzbu(id) {
            if (!confirm('Obrisati narudžbu?')) return;
            try {
                const res = await fetch(`/api/admin/narudbe/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-pass': adminPassword }
                });
                if (!res.ok) throw new Error('Brisanje nije uspjelo');
                narudzbe = narudzbe.filter(n => n._id !== id);
                azurirajStatuse();
                renderNarudzbe();
            } catch (err) {
                console.error(err);
                alert('Neuspjelo brisanje.');
            }
        }

        async function posaljiPatch(id, body) {
            try {
                const res = await fetch(`/api/admin/narudbe/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'x-admin-pass': adminPassword,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error('Ažuriranje nije uspjelo');
                const updated = await res.json();
                narudzbe = narudzbe.map(n => n._id === updated._id ? updated : n);
                azurirajStatuse();
                renderNarudzbe();
            } catch (err) {
                console.error(err);
                alert('Neuspjelo spremanje izmjena.');
            }
        }

        window.promijeniStatus = promijeniStatus;
        window.togglePlacanje = togglePlacanje;
        window.spremiNapomenu = spremiNapomenu;
        window.urediNapomenu = urediNapomenu;
        window.sortTable = sortTable;

        function odjava() {
            adminPassword = '';
            narudzbe = [];
            document.getElementById('adminPass').value = '';
            loginSection?.classList.remove('hidden');
            dashboard?.classList.add('hidden');
            tableWrapper.innerHTML = '';
            emptyState.classList.add('hidden');
            document.getElementById('statTotal').textContent = '0';
            document.getElementById('statShipped').textContent = '0';
            document.getElementById('statPaid').textContent = '0';
        }
        window.obrisiNarudzbu = obrisiNarudzbu;
    </script>
</body>
</html>
